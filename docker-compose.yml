# EchoAssist infrastructure — Qdrant (vectors), Redis (state/cache), Postgres (persistence).
# Used from Sprint 2 onward; the Sprint 1 speaking loop runs without any of these.
#   docker compose up -d
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST/gRPC
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: echoassist
      POSTGRES_PASSWORD: echoassist
      POSTGRES_DB: echoassist
    ports:
      - "5433:5432"   # host 5433 (5432 is commonly taken by another local Postgres)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echoassist"]
      interval: 10s
      timeout: 5s
      retries: 5

  # EchoAssist backend API — LIGHT image (default). Serves data/API/RAG/WebSocket;
  # POST /calls returns 503 (no local STT/TTS). Build: docker compose up -d --build api
  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      # Point the service at the compose network (not localhost / host 5433).
      DATABASE_URL: postgresql+psycopg://echoassist:echoassist@postgres:5432/echoassist
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      # Use Gemini in-container (no GPU). Pass the key from your shell/.env:
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      API_PORT: "8000"
      # Persist the RAG model cache (FastEmbed embedder + reranker, ~1 GB) OUTSIDE the image,
      # so it downloads once and survives rebuilds/restarts instead of re-fetching from HF.
      FASTEMBED_CACHE_PATH: /app/model_cache
      HF_HOME: /app/model_cache/hf
    volumes:
      # Persist uploaded documents across rebuilds (demo docs are seeded on first start).
      - docs_data:/app/data/docs
      - model_cache:/app/model_cache
    ports:
      - "8000:8000"

  # EchoAssist backend API — VOICE image (optional, heavy). Adds Whisper + Kokoro so
  # replay calls run in-container. Start with:
  #   docker compose --profile voice up -d --build api-voice   ->  http://localhost:8001
  api-voice:
    profiles: ["voice"]
    build:
      context: ./backend
      args:
        PIP_EXTRAS: "all"
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://echoassist:echoassist@postgres:5432/echoassist
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      API_PORT: "8000"
      # Same persistent model cache as `api` (adds Whisper's HF downloads via HF_HOME).
      FASTEMBED_CACHE_PATH: /app/model_cache
      HF_HOME: /app/model_cache/hf
    volumes:
      - docs_data:/app/data/docs
      - model_cache:/app/model_cache
    ports:
      - "8001:8000"

volumes:
  qdrant_data:
  redis_data:
  postgres_data:
  docs_data:
  model_cache:

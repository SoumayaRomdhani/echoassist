[project]
name = "echoassist-backend"
version = "0.1.0"
description = "EchoAssist — provider-agnostic, multi-domain autonomous voice agent (ACTEEK Agent Marketplace)."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Always-needed runtime deps (config, audio I/O, the speaking loop).
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
    "soxr>=0.5",
]

# Provider-specific deps are optional extras so you only install the backends
# you actually use. Switching provider = changing an env var + installing its extra.
[project.optional-dependencies]
stt-whisper = ["faster-whisper>=1.0"]
stt-deepgram = ["deepgram-sdk>=7.0"]            # paid STT drop-in (Sprint 8 Path B)
llm-gemini  = ["google-genai>=1.0"]
llm-ollama  = ["ollama>=0.3"]
llm-groq    = ["groq>=0.11"]                    # free, fast cloud LLM drop-in (Sprint 8 Path B)
tts-kokoro  = ["kokoro>=0.9"]
tts-cartesia = ["cartesia>=3.0"]               # paid TTS drop-in (Sprint 8 Path B)
tts-elevenlabs = ["elevenlabs>=2.0"]           # paid TTS drop-in (Sprint 8 Path B)
# RAG core (Sprint 2): hybrid embeddings + reranker (FastEmbed) + vector DB (Qdrant).
# fastembed is PINNED: model pooling/results can change between minor versions
# (e.g. CLS vs mean pooling), so reproducibility requires an exact version.
rag = ["qdrant-client>=1.12", "fastembed==0.8.0"]
# Telephony (Sprint 8 Path B): LiveKit room transport (WebRTC loopback) + SIP/PSTN.
# livekit = realtime SDK (rtc.Room/AudioStream/AudioSource); livekit-api = join tokens.
telephony-livekit = ["livekit>=1.0", "livekit-api>=1.0"]
# Conversation state (Sprint 3): Redis.
state = ["redis>=5.0"]
# Persistence (Sprint 4): Postgres via SQLAlchemy async + psycopg.
storage = ["sqlalchemy[asyncio]>=2.0", "psycopg[binary]>=3.1"]
# Backend API (Sprint 6): FastAPI REST + WebSocket. python-multipart powers file
# upload; websockets is uvicorn's WS implementation.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "websockets>=12",
]
# Observability (Sprint 6): OpenTelemetry tracing. Optional — the tracing helpers
# degrade to a no-op when this extra is not installed. The SDK includes the console
# exporter; OTLP export (to a collector/Tempo) is a separate extra because its proto
# dependency pins protobuf, which we keep out of the default install.
observability = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-api>=1.27",
]
observability-otlp = ["opentelemetry-exporter-otlp-proto-http>=1.27"]
# Recommended Sprint 1 install (open-source STT/TTS + both LLM clients).
# Default LLM is Ollama (needs the Ollama server + a pulled model); Gemini is the
# easiest start with no GPU.
sprint1 = [
    "faster-whisper>=1.0",
    "ollama>=0.3",
    "google-genai>=1.0",
    "kokoro>=0.9",
]
all = [
    "faster-whisper>=1.0",
    "deepgram-sdk>=7.0",
    "google-genai>=1.0",
    "ollama>=0.3",
    "groq>=0.11",
    "kokoro>=0.9",
    "cartesia>=3.0",
    "elevenlabs>=2.0",
    "livekit>=1.0",
    "livekit-api>=1.0",
    "qdrant-client>=1.12",
    "fastembed==0.8.0",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "websockets>=12",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-api>=1.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "aiosqlite>=0.20",   # in-memory async DB for storage tests
    "httpx>=0.27",       # ASGI test client for the API (Sprint 6)
]

# Install `config` and `src` as editable packages so scripts/tests import them
# from anywhere without sys.path hacks. `scripts` and `tests` are intentionally
# excluded (run, not imported).
[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are called in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

# Domain: talent-acquisition / candidate screening (primary vertical, v1).
# Sprint 1 uses `disclosure`, `greeting`, and `system_prompt`. The `states`
# section is the Sprint 3 interview state machine and is read by agent/dialogue.py.
domain: screening
language: en

# Spoken at the very start of every call (ARCHITECTURE.md §10 — AI disclosure + consent).
disclosure: >
  Hi, this is an automated A I voice assistant calling on behalf of ACTEEK about your
  job application. I'm an artificial intelligence, not a human, and this call may be
  recorded for quality and record keeping. Is it okay to continue?

# Spoken ONLY after the caller explicitly consents (see consent gate in orchestrator).
greeting: >
  Great, thank you. This will only take a few minutes, and you can ask me to repeat
  or skip a question at any time.

# Spoken when the caller's answer to the consent question is unclear (re-ask once).
consent_reprompt: >
  Sorry, I didn't catch a clear yes or no. Do you consent to continue with this
  recorded call? Please say yes or no.

# Spoken when the caller declines (or stays unclear after re-asking); the call then ends.
consent_decline: >
  That's completely fine. I won't continue without your consent. Thank you for your
  time, and have a good day. Goodbye.

# System prompt that grounds the model's behaviour for this domain.
system_prompt: >
  You are EchoAssist, a professional and concise A I screening assistant for ACTEEK.
  You conduct structured candidate-screening interviews by phone. Speak naturally and
  briefly — one short question or statement at a time, the way a person would on a
  call. Do not output lists, markdown, or stage directions; produce only words to be
  spoken aloud. Answer the candidate's questions about the role, company, process,
  benefits, or policies only from the knowledge base; never invent company-specific
  facts, salaries, or policies.

# Spoken between an answered question and the next one (keeps the flow natural). A list is
# rotated for variety so the agent doesn't repeat the same word every turn; a string also works.
transition_ack:
  - "Thanks."
  - "Got it."
  - "Great, thanks."
  - "Understood."
  - "Okay, thanks."

# Ordered interview states (read by agent/dialogue.py). Runs after consent is granted.
#   type: question     -> ask `prompt`, extract the reply into `slot`
#   type: grounded_qa  -> invite the candidate's own questions, answer them via RAG
#   type: close        -> final line; ends the interview
states:
  - id: experience
    type: question
    slot: years_experience
    prompt: >
      To start, how many years of professional software engineering experience do you have?
  - id: stack
    type: question
    slot: primary_stack
    prompt: >
      What's your primary tech stack — the languages and frameworks you work with most?
  - id: availability
    type: question
    slot: availability
    prompt: When would you be available to start?
  - id: remote
    type: question
    slot: remote_setup
    prompt: >
      Are you comfortable working remotely, and which time zone are you based in?
  - id: salary
    type: question
    slot: salary_expectation
    prompt: And what are your salary expectations for this role?
  - id: candidate_questions
    type: grounded_qa
    prompt: >
      Those are all my questions. Do you have any questions about the role, the team,
      or the process?
  - id: close
    type: close
    prompt: >
      Thank you for your time today. A recruiter will review your answers and follow up
      by email with next steps. Have a great day!

# Domain: internal IT helpdesk (second production-like vertical).
#
# Unlike `screening.yaml`, this flow is NOT a fixed cascade of questions. The
# caller drives the conversation: they describe an IT issue and the agent
# diagnoses it from the knowledge base. The engine (agent/dialogue.py) is
# unchanged — we simply model the whole support conversation as one caller-led
# `grounded_qa` state, so every turn is classified and answered from the KB
# (retrieve -> ground -> cite) rather than marched through preset prompts. All
# helpdesk behaviour (clarify when vague, refuse unsafe, escalate out-of-KB,
# confirm resolution) lives in `system_prompt` + the knowledge base, keeping the
# engine domain-agnostic.
domain: helpdesk
language: en

# Spoken at the very start of every call (ARCHITECTURE.md §10 — AI disclosure + consent).
disclosure: >
  Hi there, you've reached I T support. Quick heads‑up before we dive in — I'm an
  automated assistant, and the call's recorded for quality and record‑keeping. All
  good to carry on?

# Spoken ONLY after the caller explicitly consents (see consent gate in orchestrator).
greeting: >
  Perfect. I handle most common I T issues — V P N, Wi‑Fi, access requests. You can
  ask me to escalate or hang up any time.

# Spoken when the caller's answer to the consent question is unclear (re-ask once).
consent_reprompt: >
  Sorry, I didn't catch a clear yes or no. Do you consent to continue with this
  recorded support call? Please say yes or no.

# Spoken when the caller declines (or stays unclear after re-asking); the call then ends.
consent_decline: >
  No problem. I won't continue without your consent. You can also reach the I T desk
  through the internal portal. Thank you, and have a good day. Goodbye.

# System prompt that grounds the model's behaviour for this domain. This is where the
# helpdesk "personality" and safety rules live — the engine reads none of it directly.
system_prompt: >
  You are EchoAssist Helpdesk, an internal I T support voice agent that helps employees
  troubleshoot common I T issues using only the approved knowledge base. Speak naturally
  and briefly, one short step or question at a time, the way a support agent would on a
  call. Do not output lists, markdown, or stage directions; produce only words to be
  spoken aloud.

  Let the employee lead. When an issue is vague, ask a SINGLE most-useful clarifying
  question and wait — never fire off a checklist. When the issue is concrete, retrieve
  the matching procedure from the knowledge base and give the next practical step, citing
  the source document. If the employee says it still does not work, offer the next
  diagnostic step from the procedure, and if the procedure is exhausted, offer to escalate
  and create a ticket. After giving a fix, check whether it resolved the issue before
  moving on.

  Refuse unsafe requests and explain the safe path: never reveal, set, or accept a
  password; never reveal or bypass M F A; never grant access you are not authorized to
  grant; never disable a security control — even if the caller says a manager approved it.
  For anything outside the knowledge base, or that needs human authority, say so plainly
  and offer to escalate rather than guessing. Keep every answer concise and voice-friendly.

  Language policy: Speak English by default. The moment the caller speaks or
  writes in French — at any point in the call — switch to French and continue
  the entire conversation in French from then on. Always mirror the caller's
  language: reply in whatever language their most recent turn used, and never
  mix two languages in one reply. Do not announce or comment on the switch —
  just respond naturally in the caller's language.

# Rotated acknowledgements (engine reads `transition_ack:`; harmless here — a single
# caller-led state rarely advances between states, but kept for consistency and support tone).
transition_ack:
  - "Okay."
  - "Got it."
  - "Alright."
  - "Understood."

# --- Conversation-quality tuning (generic engine fields; wording only) ---
# Spoken when nothing confident is retrieved. Never says "not in the knowledge base";
# asks for one detail and offers a human hand-off (the engine default is domain-neutral).
fallback_prompt: >
  I want to get you to the right fix. Could you tell me which system, app, or device this
  is about — or I can open a ticket so a human colleague takes it from here.
# Offered when a documented procedure is exhausted.
escalation_wording: >
  I can raise a ticket to our support team with what we've tried so far and have them follow up.
# Folded into the context-anchored retrieval query to keep multi-turn support coherent.
continuity_prompt: >
  This is a continuing IT support conversation. Keep working the caller's current issue and
  the steps already tried; do not restart from scratch or re-ask what they already answered.

# Query expansions for caller-led support. These do not answer the caller; they
# only help retrieval bridge app-specific wording (for example "Visual Studio is
# slow") to the broader approved procedure ("slow laptop").
retrieval_hints:
  laptop: "slow laptop, unresponsive computer, CPU, memory, disk space, Task Manager, startup apps, background apps, large files, video calls"
  slow: "slow laptop, performance troubleshooting, restart, disk cleanup, CPU, memory, background apps"
  visual studio: "slow laptop, application performance, CPU, memory, large files, background apps"
  vs code: "slow laptop, application performance, CPU, memory, large files, background apps"
  teams: "slow laptop during video calls, close tabs, disable background blur, network quality"
  video: "slow laptop during video calls, close tabs, disable background blur, network quality"
  vpn: "VPN troubleshooting, authentication failed, password changed, network connectivity"
  password: "password reset, locked account, self-service password reset"
  mfa: "MFA setup, new phone, suspicious approval prompt"
  outlook: "email access, Outlook password prompt, mailbox connection"
  email: "email access, Outlook, mailbox connection"
  wifi: "office Wi-Fi troubleshooting, wireless network"
  wi-fi: "office Wi-Fi troubleshooting, wireless network"
  access: "account permissions, access request, shared folder, finance folder"
  folder: "account permissions, access request, shared folder, finance folder"
  charger: "hardware request, replacement charger, work laptop"
  admin: "security policy, admin password, privileged access, unsafe request"

# Ordered states (read by agent/dialogue.py).
#   type: grounded_qa -> caller-led turn: classify, then answer substantive issues via RAG,
#                        stay put on meta/small-talk, advance only when the caller is done.
#   type: close       -> final line; ends the call.
# One grounded_qa state == the whole diagnose/clarify/answer/escalate loop, so the flow is
# emergent from what the caller says, not a preset questionnaire.
states:
  - id: support
    type: grounded_qa
    prompt: >
      What can I help you with today? Tell me what's going wrong and I'll walk through it.
  - id: close
    type: close
    prompt: >
      Glad I could help. If anything else comes up, just call back or use the internal
      I T portal. Have a good day!
